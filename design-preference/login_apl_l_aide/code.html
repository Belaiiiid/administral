<!DOCTYPE html>

<html class="h-full" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Connexion - APL à l'Aide</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"primary-fixed": "#dbe1ff", "surface-tint": "#3559b6", "tertiary-container": "#1b222f", "on-primary-fixed-variant": "#15409d", "surface-container": "#eeeeee", "on-secondary-container": "#76153e", outline: "#757680", "inverse-primary": "#b4c5ff", "tertiary-fixed-dim": "#bfc6d8", "surface-card": "#FFFFFF", "surface-bright": "#f9f9f9", "border-subtle": "#E5E7EB", error: "#ba1a1a", "surface-container-highest": "#e2e2e2", "primary-container": "#001d59", "on-error": "#ffffff", "status-error": "#C00327", "on-tertiary-fixed": "#141c28", "inverse-on-surface": "#f0f1f1", "error-container": "#ffdad6", "text-main": "#1F2937", "surface-variant": "#e2e2e2", "on-secondary-fixed-variant": "#821f47", background: "#f9f9f9", "on-tertiary-container": "#828999", "text-muted": "#6B7280", surface: "#f9f9f9", "secondary-fixed-dim": "#ffb1c6", "surface-container-high": "#e8e8e8", secondary: "#a1385f", tertiary: "#050c18", "inverse-surface": "#2f3131", "surface-container-low": "#f3f3f4", "on-tertiary": "#ffffff", "on-surface": "#1a1c1c", "on-primary": "#ffffff", "on-primary-container": "#6485e5", primary: "#000929", "surface-container-lowest": "#ffffff", "on-tertiary-fixed-variant": "#404755", "surface-dim": "#dadada", "primary-fixed-dim": "#b4c5ff", "on-surface-variant": "#45464f", "secondary-fixed": "#ffd9e1", "on-background": "#1a1c1c", "on-secondary": "#ffffff", "on-error-container": "#93000a", "secondary-container": "#fd81a9", "outline-variant": "#c5c6d0", "tertiary-fixed": "#dbe2f4", "on-secondary-fixed": "#3f001c", "on-primary-fixed": "#00174b"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {gutter: "24px", "margin-desktop": "32px", "margin-mobile": "16px", unit: "8px", "container-max": "1200px"}, fontFamily: {"headline-lg": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"], headline: ["Inter"], display: ["Inter"], body: ["Inter"], label: ["Inter"]}, fontSize: {}}}};</script>
<style>
        body {
            background-color: #F6F8FA;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }
        .france-connect-btn {
            background: #000091;
            color: white;
            transition: background 0.2s;
        }
        .france-connect-btn:hover {
            background: #1212ff;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile py-12">
<div class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Logo / Brand Header -->
<div class="text-center mb-8">
<div class="flex items-center justify-center gap-2 mb-2">
<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center text-white">
<span class="material-symbols-outlined text-headline-md" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">APL à l'Aide</h1>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Service Public de la Transition Écologique</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-border-subtle p-8 soft-shadow">
<h2 class="font-headline-md text-headline-md text-on-surface mb-6">Connexion</h2>
<!-- FranceConnect Integration -->
<div class="mb-8">
<button class="france-connect-btn w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg font-label-md text-label-md">
<div class="bg-white p-0.5 rounded-sm">
<img alt="FranceConnect" class="h-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDVTR4W_mZz-igos3ZRJJ90_7Yz94WS5v0wxwsGwSbW4gWcbeLTGtII78_64_bRZcNI4Fxuy6FyH6VtazDv_kThq1CyjoSDyBTxWuosTwo-F_RUgQhexelGycNqMaoznHycL0oMDjUoyGq0FEMkVhiyyVNFHpInoJtQ4-AhW1sy9sHXwEjN9OBEKJhcOIlXjMQu8wpl3RltkzwmBtCVhjv7CkLuje-qXfEBnmzqKCx9LosR_gCD-CCx1Q"/>
</div>
                        S'identifier avec FranceConnect
                    </button>
<div class="mt-3 text-center">
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Qu'est-ce que FranceConnect ?</a>
</div>
</div>
<!-- Divider -->
<div class="relative mb-8">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-subtle"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-surface-container-lowest text-text-muted font-label-sm">OU</span>
</div>
</div>
<!-- Traditional Login Form -->
<form class="space-y-6" id="loginForm" onsubmit="return handleLogin(event)">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">Adresse e-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-white border border-border-subtle rounded-lg text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="email" name="email" placeholder="nom@exemple.fr" required="" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Mot de passe</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Oublié ?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-white border border-border-subtle rounded-lg text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eyeIcon">visibility</span>
</button>
</div>
<!-- Error Message (Hidden by default) -->
<p class="hidden text-error font-label-sm text-label-sm flex items-center gap-1 mt-2" id="errorMessage">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
                            Identifiants incorrects. Veuillez réessayer.
                        </p>
</div>
<div class="flex items-center">
<input class="w-4 h-4 text-primary border-border-subtle rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="ml-2 font-body-sm text-body-sm text-on-surface-variant select-none" for="remember">Se souvenir de moi</label>
</div>
<button class="w-full bg-primary-container text-on-primary py-3 rounded-lg font-label-md text-label-md hover:bg-primary transition-colors active:scale-[0.98] duration-150" type="submit">
                        Se connecter
                    </button>
</form>
<div class="mt-8 pt-6 border-t border-border-subtle text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Vous n'avez pas de compte ? 
                        <a class="text-primary font-label-sm hover:underline ml-1" href="#">Créer un espace personnel</a>
</p>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 flex flex-wrap justify-center gap-x-6 gap-y-2">
<a class="font-label-sm text-label-sm text-text-muted hover:text-primary transition-colors" href="#">Accessibilité</a>
<a class="font-label-sm text-label-sm text-text-muted hover:text-primary transition-colors" href="#">Mentions légales</a>
<a class="font-label-sm text-label-sm text-text-muted hover:text-primary transition-colors" href="#">Besoin d'aide ?</a>
</div>
</div>
</main>
<!-- UI Interaction Script -->
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const errorMsg = document.getElementById('errorMessage');
            const email = document.getElementById('email');
            const pass = document.getElementById('password');
            
            // Artificial delay to simulate validation
            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.innerHTML = `<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Vérification...</span>`;
            btn.disabled = true;

            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                
                // Demo: always show error for UI demonstration
                errorMsg.classList.remove('hidden');
                email.classList.add('border-error');
                pass.classList.add('border-error');
                
                // Shake effect
                const card = document.querySelector('.bg-surface-container-lowest');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 500);
            }, 1000);

            return false;
        }
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 0s 2;
        }
    </style>
</body></html>
